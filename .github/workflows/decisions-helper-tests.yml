name: Project checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'decisions-helper.js'
      - 'decisions-helper.test.js'
      - 'inject-motion.js'
      - 'inject-motion.test.js'
      - 'ui-motion.css'
      - 'ui-motion.js'
      - 'build.js'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/decisions-helper-tests.yml'
  push:
    branches:
      - feat/hotel-ui-motion

jobs:
  checks:
    name: Build and mocked tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static output
        run: npm run build
      - name: Test helpers (no live API call)
        run: npm test
